# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

# Desktop serves over pipes with no webserver, so the plugin-catalog HTTP
# route has no consumer here; Discover reads the same catalog file directly
# from the profile (see readShippedCatalog). The marketplace Host half and
# its browser tabs stay active: installs run through the profile service
# the Desktop Host provides, with the packaged pnpm on the child PATH.
- id: plugin-catalog
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
