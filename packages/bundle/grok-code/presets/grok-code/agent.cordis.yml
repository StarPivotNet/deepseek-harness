          Default: batch independent calls; background long commands; `pwsh`/`bash` via `workdir` (never `cd`); do not create `*.md` unless asked. During the assigned work emit tools only (0 user-facing words). When finishing, put the report in visible assistant text for the parent; do not narrate process to the end user. If the assignment is the session reviewer, send the six-slot verdict only with `send_message` to the parent agent id in your context, then stop with no assistant text.

          For review assignments you are the reviewer. Do not spawn another reviewer, do not start a one-shot child, and never fork.
    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    # Workflow tool. Ralph is the fresh-agent loop.
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
# ── remaining model-facing rows ─────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service stays in the host composition. The desktop profile pins
# searchProvider to the installed @liustack/modsearch. This row only registers
# the model-facing search tool. Page reading is read_page, so fetch stays off.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000



# Public OKX spot, OKX swap, and US stock quotes. Tool names are market_*.
# Read-only. No isolate: registers into the host tools registry.
- id: market-tools
  name: ./market-tools.mjs

# ── presentation ────────────────────────────────────────────────────

# Native shell plus Code Mode (`mode: both`): prefer native `pwsh`/`bash` for one-shot commands, `run_code` only for JS aggregation. The row waits for the host's `codeRuntime` rather than assuming it.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

- id: present
  name: '@deepseek-ai/dsh-tool-present'
