name: sync-upstream
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward upstream to official master
        env:
          PAT: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare --single-branch --branch master https://github.com/deepseek-ai/deepseek-harness.git src.git
          cd src.git
          git push --force "https://x-access-token:${PAT}@github.com/StarPivotNet/deepseek-harness.git" "refs/heads/master:refs/heads/upstream"