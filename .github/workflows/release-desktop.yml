# Pack DeepSeek Harness desktop installers and publish them as a GitHub
# Release. Pack is credential-free and runs from a desktop-v* tag or a
# manual dispatch; publication is a separate job that consumes those bytes.
name: Release (desktop)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packed installers as a GitHub Release. Must run from a desktop-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-latest
            name: macOS arm64 zip
          - platform: linux
            runner: ubuntu-24.04
            name: Linux x64 AppImage
          - platform: win32
            runner: windows-latest
            name: Windows x64 zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify desktop tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node --import tsx/esm -e '
            import { desktopVersion, verifyDesktopTag } from "./scripts/desktop/pack.ts"
            verifyDesktopTag(desktopVersion(), process.env.GITHUB_REF ?? "")
          '

      - name: Pack desktop installer
        shell: bash
        run: pnpm exec tsx scripts/desktop/pack.ts --platform ${{ matrix.platform }}

      # Boot-smoke the staged Host on the POSIX packers: a composition or
      # deploy-closure breakage must fail the pack job instead of shipping
      # an archive that cannot start.
      # Use node --import (not pnpm exec): pnpm exec can re-resolve the workspace
      # after pack and prune the tsx bin the smoke needs.
      - name: Boot-smoke the staged Host
        if: matrix.platform != 'win32'
        shell: bash
        env:
          # electron-builder may leave NODE_ENV=production and prune tsx; keep smoke runnable.
          NODE_ENV: development
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          smoke_home="$(mktemp -d "${RUNNER_TEMP:-/tmp}/dsh-smoke-home.XXXXXX")"
          export HOME="$smoke_home"
          export DSH_HOME="$smoke_home/.dsh"
          mkdir -p "$DSH_HOME"
          # Capture a short raw Host boot attempt for triage if smoke fails.
          set +e
          dist-desktop/staging/host/node dist-desktop/staging/host/dsh/lib/bin.js web --port 0 --no-open             > /tmp/dsh-staged-host-boot.log 2>&1 &
          host_pid=$!
          sleep 8
          kill "$host_pid" 2>/dev/null || true
          wait "$host_pid" 2>/dev/null || true
          set -e
          echo "===== staged Host raw boot (8s) ====="
          sed -n '1,200p' /tmp/dsh-staged-host-boot.log || true
          node --import tsx/esm scripts/desktop/host-boot-smoke.ts --host dist-desktop/staging/host

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-desktop/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Authorize publication
        env:
          REF: ${{ github.ref }}
        run: |
          node --import tsx/esm -e '
            import { desktopVersion, verifyDesktopTag } from "./scripts/desktop/pack.ts"
            verifyDesktopTag(desktopVersion(), process.env.REF ?? "")
          '

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop/release
          merge-multiple: true

      - name: Record artifact hashes
        working-directory: dist-desktop/release
        run: |
          shopt -s nullglob
          archives=(*.zip *.AppImage)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "desktop release: no zip or AppImage archives under dist-desktop/release"
            exit 1
          fi
          sha256sum "${archives[@]}" | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node --import tsx/esm -e 'import { desktopVersion } from "./scripts/desktop/pack.ts"; process.stdout.write(desktopVersion())')"
          tag="desktop-v${version}"
          previous="$(git describe --tags --abbrev=0 --match 'desktop-v*' "${tag}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="${previous}..${tag}"
          else
            range="$tag"
          fi
          git log --no-merges --format='%s' "$range" > /tmp/dsh-desktop-git-log.txt
          NOTES_VERSION="$version" node --import tsx/esm -e '
            import { readFileSync, writeFileSync } from "node:fs"
            import { desktopReleaseNotes } from "./scripts/desktop/pack.ts"
            const log = readFileSync("/tmp/dsh-desktop-git-log.txt", "utf8")
            writeFileSync("/tmp/dsh-desktop-notes.md", desktopReleaseNotes(process.env.NOTES_VERSION ?? "", log))
          '
          shopt -s nullglob
          archives=(dist-desktop/release/*.zip dist-desktop/release/*.AppImage)
          extra=()
          if [[ "$version" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$tag" \
            --title "DeepSeek Harness 桌面版 ${version}" \
            --notes-file /tmp/dsh-desktop-notes.md \
            --verify-tag \
            "${extra[@]}" \
            "${archives[@]}" \
            dist-desktop/release/SHA256SUMS
